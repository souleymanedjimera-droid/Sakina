# Configuration coturn — serveur TURN pour les appels audio Sakîna
# À placer sur le serveur en /etc/turnserver.conf (ou monté dans le conteneur Docker).

# --- Identité du serveur ---
realm=turn.votre-domaine.com
server-name=turn.votre-domaine.com

# --- Ports d'écoute ---
listening-port=3478
tls-listening-port=5349

# --- Authentification par secret partagé (TURN REST API, RFC 5766 Annexe A) ---
# Le secret doit être IDENTIQUE à la variable TURN_SECRET côté application Next.js.
# Chaque appel génère un identifiant/mot de passe temporaire dérivé de ce secret
# (voir app/api/calls/turn-credentials) : on ne crée jamais de compte TURN permanent.
use-auth-secret
static-auth-secret=CHANGEZ_MOI_AVEC_UN_SECRET_LONG_ET_ALEATOIRE

# --- Plage de ports relayés (à ouvrir sur le pare-feu, UDP) ---
min-port=49152
max-port=49500

# --- Chiffrement (fortement recommandé en production) ---
# Certificats obtenus via Let's Encrypt (voir README pour la procédure certbot).
cert=/etc/letsencrypt/live/turn.votre-domaine.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.votre-domaine.com/privkey.pem

# --- Durcissement ---
no-cli
no-tlsv1
no-tlsv1_1
fingerprint
stale-nonce=600
# Empêche le serveur de relayer vers des adresses privées/locales (anti-SSRF).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255

# --- Journalisation (métadonnées de connexion uniquement, jamais de contenu audio) ---
log-file=/var/log/turnserver.log
verbose

# --- Divers ---
fingerprint
no-multicast-peers
